<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASID GO Firebase Test</title>
</head>

<body>

    <h1>ASID GO 🔥</h1>

    <h2>FIREBASE TEST VERSION 3</h2>

    <button id="testButton" type="button">
        TEST FIREBASE NOW
    </button>

    <p id="status">
        Status: Page loaded
    </p>

    <script type="module">

        const button = document.getElementById("testButton");
        const status = document.getElementById("status");

        console.log("STEP 1: PAGE JAVASCRIPT LOADED");

        button.addEventListener("click", function () {

            console.log("STEP 2: BUTTON CLICKED");

            status.innerText =
                "Status: BUTTON IS WORKING ✅";

            alert("BUTTON IS WORKING! 🎉");

        });

    </script>

</body>

</html>
