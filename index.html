<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ASID GO Firebase Debug</title>

</head>

<body>

    <h1>ASID GO 🔥</h1>

    <h2>FIREBASE DEBUG VERSION 5</h2>

    <button
        id="testButton"
        type="button">

        TEST FIREBASE NOW

    </button>

    <p id="status">
        Status: Page loaded
    </p>


    <script type="module">

        const status =
            document.getElementById("status");

        const button =
            document.getElementById("testButton");


        status.innerText =
            "Status: Loading Firebase...";


        try {


            const firebaseModule =
                await import("./firebase.js");


            const db =
                firebaseModule.db;


            const firestore =
                await import(
                    "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js"
                );


            const collection =
                firestore.collection;

            const addDoc =
                firestore.addDoc;

            const serverTimestamp =
                firestore.serverTimestamp;


            status.innerText =
                "Status: Firebase loaded ✅";


            button.addEventListener(
                "click",
                async function () {


                    status.innerText =
                        "Status: Saving data...";


                    try {


                        const docRef =
                            await addDoc(

                                collection(
                                    db,
                                    "test"
                                ),

                                {

                                    message:
                                        "ASID GO TEST",

                                    createdAt:
                                        serverTimestamp()

                                }

                            );


                        status.innerText =
                            "SUCCESS! Firebase connected ✅ " +
                            "ID: " +
                            docRef.id;


                        alert(
                            "FIREBASE WORKS! 🎉"
                        );


                    }

                    catch (error) {


                        status.innerText =
                            "FIREBASE ERROR ❌ " +
                            error.message;


                        alert(
                            "FIREBASE ERROR:\n\n" +
                            error.message
                        );

                    }

                }
            );

        }

        catch (error) {


            status.innerText =
                "FIREBASE LOAD ERROR ❌ " +
                error.message;


            alert(
                "FIREBASE LOAD ERROR:\n\n" +
                error.message
            );

        }

    </script>

</body>

</html>s
