<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ASID GO Firebase Test</title>

</head>

<body>

    <h1>ASID GO 🔥</h1>

    <h2>FIREBASE TEST VERSION 4</h2>

    <p>
        Test Firebase Firestore connection
    </p>

    <button
        id="testButton"
        type="button">

        TEST FIREBASE NOW

    </button>

    <p id="status">
        Status: Page loaded
    </p>


    <script type="module">

        import { db } from "./firebase.js";

        import {
            collection,
            addDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


        const button =
            document.getElementById("testButton");

        const status =
            document.getElementById("status");


        console.log(
            "🔥 FIREBASE SCRIPT LOADED"
        );


        button.addEventListener(
            "click",
            async function () {


                console.log(
                    "🔥 BUTTON CLICKED"
                );


                button.disabled = true;

                button.innerText =
                    "CONNECTING...";


                status.innerText =
                    "Status: Connecting to Firebase...";


                try {


                    console.log(
                        "🔥 Starting Firestore..."
                    );


                    const docRef =
                        await addDoc(

                            collection(
                                db,
                                "test"
                            ),

                            {

                                message:
                                    "ASID GO Firebase Test",

                                createdAt:
                                    serverTimestamp()

                            }

                        );


                    console.log(
                        "🔥 DATA SAVED!",
                        docRef.id
                    );


                    status.innerText =
                        "Status: FIREBASE CONNECTED ✅";


                    button.innerText =
                        "FIREBASE WORKS ✅";


                    alert(
                        "FIREBASE WORKS! 🎉\n\n" +
                        "Document ID: " +
                        docRef.id
                    );


                }

                catch (error) {


                    console.error(
                        "🔥 FIREBASE ERROR:",
                        error
                    );


                    status.innerText =
                        "Status: FIREBASE ERROR ❌";


                    button.disabled =
                        false;


                    button.innerText =
                        "TRY AGAIN";


                    alert(
                        "Firebase Error:\n\n" +
                        error.message
                    );

                }

            }

        );

    </script>

</body>

</html>
