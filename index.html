<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ASID GO Firebase Test</title>

</head>

<body>

    <h1>ASID GO 🔥</h1>

    <h2>FIREBASE TEST VERSION 6</h2>

    <p>
        Testing ASID GO connection to Firebase Firestore.
    </p>


    <button
        id="testButton"
        type="button">

        TEST FIREBASE NOW

    </button>


    <p id="status">

        Status: Page loaded

    </p>


    <script type="module">

        const button =
            document.getElementById("testButton");

        const status =
            document.getElementById("status");


        console.log(
            "🔥 ASID GO VERSION 6 STARTED"
        );


        status.innerText =
            "Status: Loading Firebase...";


        try {


            /*
             * IMPORTANT:
             * ?v=2 forces the browser
             * to load the newest firebase.js
             */

            const firebaseModule =
                await import(
                    "./firebase.js?v=2"
                );


            const db =
                firebaseModule.db;


            console.log(
                "🔥 Firebase module loaded"
            );


            const firestore =
                await import(
                    "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js"
                );


            const collection =
                firestore.collection;

            const addDoc =
                firestore.addDoc;

            const serverTimestamp =
                firestore.serverTimestamp;


            console.log(
                "🔥 Firestore module loaded"
            );


            status.innerText =
                "Status: Firebase loaded ✅";


            button.addEventListener(
                "click",
                async function () {


                    console.log(
                        "🔥 TEST BUTTON CLICKED"
                    );


                    button.disabled =
                        true;


                    button.innerText =
                        "SAVING...";


                    status.innerText =
                        "Status: Saving test data...";


                    try {


                        const docRef =
                            await addDoc(

                                collection(
                                    db,
                                    "test"
                                ),

                                {

                                    message:
                                        "ASID GO Firebase Test",

                                    createdAt:
                                        serverTimestamp()

                                }

                            );


                        console.log(
                            "🔥 DATA SAVED:",
                            docRef.id
                        );


                        status.innerText =
                            "Status: FIREBASE CONNECTED ✅";


                        button.innerText =
                            "FIREBASE WORKS ✅";


                        alert(
                            "FIREBASE WORKS! 🎉\n\n" +
                            "Document ID:\n" +
                            docRef.id
                        );


                    }

                    catch (error) {


                        console.error(
                            "🔥 FIRESTORE ERROR:",
                            error
                        );


                        status.innerText =
                            "FIRESTORE ERROR ❌ " +
                            error.message;


                        button.disabled =
                            false;


                        button.innerText =
                            "TRY AGAIN";


                        alert(
                            "FIRESTORE ERROR:\n\n" +
                            error.message
                        );

                    }

                }
            );


        }

        catch (error) {


            console.error(
                "🔥 FIREBASE LOAD ERROR:",
                error
            );


            status.innerText =
                "FIREBASE LOAD ERROR ❌ " +
                error.message;


            button.disabled =
                true;


            button.innerText =
                "FIREBASE FAILED";


            alert(
                "FIREBASE LOAD ERROR:\n\n" +
                error.message
            );

        }

    </script>

</body>

</html>
