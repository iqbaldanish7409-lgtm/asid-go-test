<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ASID GO Order Test</title>

</head>

<body>

    <h1>ASID GO 🚗</h1>

    <h2>ORDER FORM VERSION 2A</h2>

    <label>
        SERVICE
    </label>

    <br>

    <select id="service">

        <option value="">
            Select service
        </option>

        <option value="ride">
            🚗 Ride
        </option>

        <option value="food">
            🍔 Food Delivery
        </option>

        <option value="parcel">
            📦 Parcel Delivery
        </option>

        <option value="runner">
            🏃 Runner Service
        </option>

    </select>


    <br>
    <br>


    <label>
        PICK-UP LOCATION
    </label>

    <br>

    <select id="pickup">

        <option value="">
            Select pick-up
        </option>

        <option value="Tualang 1">
            Tualang 1
        </option>

        <option value="Tualang 2">
            Tualang 2
        </option>

        <option value="Tualang 3">
            Tualang 3
        </option>

        <option value="Dahlia 1">
            Dahlia 1
        </option>

        <option value="Dahlia 2">
            Dahlia 2
        </option>

        <option value="Dahlia 3">
            Dahlia 3
        </option>

        <option value="Dinamik">
            Dinamik
        </option>

        <option value="Etika">
            Etika
        </option>

        <option value="Progresif">
            Progresif
        </option>

        <option value="PTAR">
            PTAR
        </option>

        <option value="Pusat Islam">
            Pusat Islam
        </option>

        <option value="Pentadbiran">
            Pentadbiran
        </option>

        <option value="PPUK">
            PPUK
        </option>

        <option value="Anjung">
            Anjung / Food Court
        </option>

        <option value="Kesihatan">
            Kesihatan
        </option>

    </select>


    <br>
    <br>


    <label>
        DESTINATION
    </label>

    <br>

    <select id="destination">

        <option value="">
            Select destination
        </option>

        <option value="Tualang 1">
            Tualang 1
        </option>

        <option value="Tualang 2">
            Tualang 2
        </option>

        <option value="Tualang 3">
            Tualang 3
        </option>

        <option value="Dahlia 1">
            Dahlia 1
        </option>

        <option value="Dahlia 2">
            Dahlia 2
        </option>

        <option value="Dahlia 3">
            Dahlia 3
        </option>

        <option value="Dinamik">
            Dinamik
        </option>

        <option value="Etika">
            Etika
        </option>

        <option value="Progresif">
            Progresif
        </option>

        <option value="PTAR">
            PTAR
        </option>

        <option value="Pusat Islam">
            Pusat Islam
        </option>

        <option value="Pentadbiran">
            Pentadbiran
        </option>

        <option value="PPUK">
            PPUK
        </option>

        <option value="Anjung">
            Anjung / Food Court
        </option>

        <option value="Kesihatan">
            Kesihatan
        </option>

    </select>


    <br>
    <br>


    <label>
        ORDER DETAILS
    </label>

    <br>

    <textarea
        id="details"
        rows="5"
        cols="40"
        placeholder="Tell the runner what you need...">
    </textarea>


    <br>
    <br>


    <button
        id="requestButton"
        type="button">

        REQUEST SERVICE

    </button>


    <p id="status">

        Status: Page loaded

    </p>


    <script>

        console.log(
            "🔥 ORDER VERSION 2A LOADED"
        );


        const button =
            document.getElementById(
                "requestButton"
            );


        const status =
            document.getElementById(
                "status"
            );


        button.addEventListener(
            "click",
            function () {


                console.log(
                    "🔥 REQUEST SERVICE CLICKED"
                );


                const service =
                    document.getElementById(
                        "service"
                    ).value;


                const pickup =
                    document.getElementById(
                        "pickup"
                    ).value;


                const destination =
                    document.getElementById(
                        "destination"
                    ).value;


                const details =
                    document.getElementById(
                        "details"
                    ).value.trim();


                if (service === "") {

                    alert(
                        "Please select a service."
                    );

                    return;

                }


                if (pickup === "") {

                    alert(
                        "Please select pick-up."
                    );

                    return;

                }


                if (destination === "") {

                    alert(
                        "Please select destination."
                    );

                    return;

                }


                if (details === "") {

                    alert(
                        "Please enter order details."
                    );

                    return;

                }


                status.innerText =
                    "REQUEST SERVICE WORKS! ✅";


                alert(
                    "REQUEST SERVICE WORKS! 🎉"
                );


            }
        );

    </script>

</body>

</html>
