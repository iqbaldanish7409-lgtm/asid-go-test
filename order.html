<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ASID GO Order Test</title>

</head>

<body>

    <h1>ASID GO 🚗</h1>

    <h2>ORDER PAGE TEST VERSION 1</h2>

    <p>
        Testing REQUEST SERVICE button.
    </p>

    <button
        id="requestButton"
        type="button">

        REQUEST SERVICE

    </button>

    <p id="status">
        Status: Page loaded
    </p>


    <script>

        const button =
            document.getElementById("requestButton");

        const status =
            document.getElementById("status");


        console.log("ORDER PAGE LOADED");


        button.addEventListener(
            "click",
            function () {

                console.log(
                    "REQUEST SERVICE CLICKED"
                );

                status.innerText =
                    "Status: BUTTON WORKS ✅";

                alert(
                    "REQUEST SERVICE WORKS! 🎉"
                );

            }
        );

    </script>

</body>

</html>
